name: Release

# Bump the VERSION file on main (or run manually) to build PTLink.exe from
# this code and publish it as a GitHub release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Build Windows exe
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o PTLink.exe .
          zip PTLink.zip PTLink.exe README.md LICENSE
          sha256sum PTLink.zip PTLink.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PTLink v${{ env.VERSION }}
          make_latest: true
          files: |
            PTLink.zip
            SHA256SUMS.txt
          body: |
            Download **PTLink.zip**, unzip it, and double-click `PTLink.exe` (don't run it as administrator).
            Windows may say "Windows protected your PC" because the app isn't signed yet: click **More info → Run anyway**.

            Unofficial fan project, not affiliated with Blitwise Productions. You need your own copy of Pocket Tanks.
